resources:
  - ../../base
nameSuffix: -dev
commonLabels:
  env: dev
patches:
  - target: { kind: Deployment, name: echo }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/args
        value: ["-text=hello from the dev overlay"]
